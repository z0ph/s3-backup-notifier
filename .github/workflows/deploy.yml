name: Deploy s3-monitor

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

permissions:
  contents: read
  id-token: write

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest

  deploy:
    name: Deploy (${{ github.ref == 'refs/heads/master' && 'prod' || 'dev' }})
    needs: lint-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/master' && 'prod' || 'dev' }}
    env:
      SAM_ENV: ${{ github.ref == 'refs/heads/master' && 'prod' || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.REGION }}
          role-session-name: gha-s3-monitor-${{ env.SAM_ENV }}
          role-duration-seconds: 1200

      - name: SAM build
        run: sam build

      - name: SAM deploy
        run: |
          sam deploy --config-env "$SAM_ENV" --no-confirm-changeset --no-fail-on-empty-changeset \
            --parameter-overrides \
              "ENV=$SAM_ENV" \
              "PROJECT=${{ secrets.PROJECT }}" \
              "MONITORINGBUCKET=${{ secrets.MONITORINGBUCKET }}" \
              "S3PREFIX=${{ secrets.S3PREFIX }}" \
              "RECIPIENTS=${{ secrets.RECIPIENTS }}" \
              "SENDER=${{ secrets.SENDER }}" \
              "ALERTRECIPIENT=${{ secrets.ALERTRECIPIENT }}"
