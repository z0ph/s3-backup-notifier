AWSTemplateFormatVersion: "2010-09-09"
Transform: "AWS::Serverless-2016-10-31"
Description: S3 Backup Notifier - https://zoph.io

Parameters:
  ENV:
    Type: String
    Default: dev
    Description: Environment name
  PROJECT:
    Type: String
    Default: s3-monitor
    Description: Project name
  MONITORINGBUCKET:
    Type: String
    Description: Bucket whose objects should be checked for daily backups
  S3PREFIX:
    Type: String
    Default: ""
    Description: S3 key prefix to scope the listing (use empty string for whole bucket)
  RECIPIENTS:
    Type: String
    Description: Whitespace-separated SES recipient email addresses
  SENDER:
    Type: String
    Description: SES verified sender email address
  ALERTRECIPIENT:
    Type: String
    Description: Single email address subscribed to the CloudWatch alarm SNS topic
  CRONENABLED:
    Type: String
    Default: ENABLED
    AllowedValues:
      - ENABLED
      - DISABLED
    Description: Whether the daily schedule is enabled

Resources:
  s3monitor:
    Type: "AWS::Serverless::Function"
    Properties:
      FunctionName: !Sub ${PROJECT}-${ENV}
      Description: !Sub "[${ENV}] S3 Backup Monitor (${PROJECT}) - https://zoph.io"
      Handler: handlers.main
      Runtime: python3.12
      CodeUri: ./python
      MemorySize: 128
      Timeout: 30
      Architectures:
        - arm64
      EventInvokeConfig:
        MaximumRetryAttempts: 0
      Environment:
        Variables:
          MONITORINGBUCKET: !Ref MONITORINGBUCKET
          S3PREFIX: !Ref S3PREFIX
          RECIPIENTS: !Ref RECIPIENTS
          SENDER: !Ref SENDER
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - s3:ListBucket
              Resource: !Sub "arn:aws:s3:::${MONITORINGBUCKET}"
            - Effect: Allow
              Action:
                - ses:SendEmail
              Resource:
                - !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${SENDER}"
      Events:
        DailySchedule:
          Type: Schedule
          Properties:
            Schedule: cron(30 6 * * ? *)
            Description: !Sub Daily schedule for ${PROJECT}
            Enabled: !If [ScheduleEnabled, true, false]
      Tags:
        Project: !Ref PROJECT
        Environment: !Ref ENV
        MonitoredBucketName: !Ref MONITORINGBUCKET
        Reference: "https://zoph.io"

  S3MonitorLogGroup:
    UpdateReplacePolicy: Delete
    DeletionPolicy: Delete
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${PROJECT}-${ENV}"
      RetentionInDays: 14

  CloudWatchLogsMetricsFilter:
    DependsOn: S3MonitorLogGroup
    Type: AWS::Logs::MetricFilter
    Properties:
      FilterPattern: "ERROR"
      LogGroupName: !Sub "/aws/lambda/${PROJECT}-${ENV}"
      MetricTransformations:
        - MetricValue: "1"
          MetricNamespace: !Sub "${PROJECT}-${ENV}"
          MetricName: "ERROR"
          DefaultValue: 0

  ErrorAlarm:
    Type: "AWS::CloudWatch::Alarm"
    Properties:
      ActionsEnabled: true
      AlarmActions:
        - !Ref AlertingTopic
      OKActions:
        - !Ref AlertingTopic
      AlarmDescription: !Sub Alarm for ERROR on ${PROJECT} Lambda function
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 2
      MetricName: ERROR
      Namespace: !Sub "${PROJECT}-${ENV}"
      Period: 60
      Statistic: Sum
      Threshold: 1
      TreatMissingData: notBreaching

  AlertingTopic:
    Type: "AWS::SNS::Topic"
    Properties:
      DisplayName: !Sub "[${ENV}] Alarm Topic for ${PROJECT}"
      Subscription:
        - Protocol: email
          Endpoint: !Ref ALERTRECIPIENT

Conditions:
  ScheduleEnabled: !Equals [!Ref CRONENABLED, ENABLED]
